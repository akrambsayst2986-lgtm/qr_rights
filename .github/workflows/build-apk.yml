name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g expo-cli eas-cli

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Create expo config
        run: |
          echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> .env

      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: |
          find . -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qr-rights-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          body: |
            🎉 QR Rights v2.0.0
            
            ✨ المميزات الجديدة:
            ✅ QR Code حقيقي 100%
            ✅ Dark Mode احترافي
            ✅ قراءة صور QR من الهاتف
            ✅ إصلاح صيغ الروابط
            ✅ إغلاق Modal بـ swipe
            ✅ واجهة احترافية أكثر
            
            📥 ثبّت APK من الأسفل
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Status
        if: always()
        run: echo "✅ تم البناء بنجاح!"
