name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g expo-cli eas-cli

      - name: Setup Java 11 (Required)
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 31
          build-tools-version: '31.0.0'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create prebuild config
        run: |
          mkdir -p android
          echo "sdk.dir=$(dirname $ANDROID_SDK_ROOT)" > android/local.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

      - name: Run Expo prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            --no-daemon \
            --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Find APK files
        run: find android -name "*.apk" -type f

      - name: List APK directory
        run: ls -la android/app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-rights-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Build Summary
        if: always()
        run: echo "✅ Build job completed"
