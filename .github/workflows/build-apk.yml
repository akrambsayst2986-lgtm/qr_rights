name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ نستخدم Node.js 18 (الأكثر استقراراً مع Expo 49)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      # ✅ نضيف خطوة تنظيف قبل التثبيت لضمان عدم وجود ملفات قديمة
      - name: Clean npm cache
        run: npm cache clean --force

      # ✅ نستخدم --legacy-peer-deps لتجاوز التعارضات دون كسر التثبيت
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Licenses & Setup Env
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/licenses
          yes | sdkmanager --licenses || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses
